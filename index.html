<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Gündem</title>
<style>
:root {
  --bg: #f2f4f7; --surface: #ffffff; --fg: #141c27; --muted: #5d6a7c; --line: #dde2ea;
  --accent: #1f46b8; --on-accent: #ffffff;
  --fight: #a01f5c; --say: #17694a; --room: #6a3fb0; --news: #3d5573; --warn: #8a5300; --warn-bg: #fbeccd;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f151d; --surface: #18202b; --fg: #e8edf4; --muted: #9dabbd; --line: #2b3545;
  --accent: #93b0ff; --on-accent: #0f151d;
  --fight: #f59ac4; --say: #7fdcb4; --room: #c5a8f5; --news: #a9bdd6; --warn: #f3c56f; --warn-bg: #40300f;
  color-scheme: dark } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 680px; margin: 0 auto; padding-block: env(safe-area-inset-top, 0px) 40px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 16px 10px; }
h1 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -.02em; }
#updated { color: var(--muted); font-size: 13px; }
#filters { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px 12px; scrollbar-width: none; }
#filters::-webkit-scrollbar { display: none; }
#filters button { flex: none; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
#filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
h2 { margin: 18px 0 6px; font-size: 13px; font-weight: 650; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
li + li { border-top: 1px solid var(--line); }
li a { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 11px 12px; color: inherit; text-decoration: none; }
li a:active, li a:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
li a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
time { color: var(--muted); font-size: 13px; line-height: 1.55; font-variant-numeric: tabular-nums; }
.title { font-size: 16px; font-weight: 550; display: block; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.cat { font-weight: 650; }
.c-Polemik { color: var(--fight); } .c-Açıklama { color: var(--say); } .c-Kulis { color: var(--room); } .c-Haber { color: var(--news); }
.flag { color: var(--warn); background: var(--warn-bg); padding: 0 5px; border-radius: 3px; }
#status { color: var(--warn); background: var(--warn-bg); padding: 8px 10px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
#gate { min-height: 80vh; display: grid; place-content: center; gap: 10px; width: min(320px, 100%); margin: 0 auto; }
#gate h1 { text-align: center; }
#gate input, #gate button { font: inherit; font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
#gate button { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; cursor: pointer; }
#err { color: var(--fight); font-size: 14px; min-height: 20px; text-align: center; margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <form id="gate" hidden>
    <h1>Gündem</h1>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Parola" aria-label="Parola" required>
    <button type="submit">Aç</button>
    <p id="err" role="alert"></p>
  </form>
  <main id="app" hidden>
    <header><h1>Gündem</h1><span id="updated"></span></header>
    <div id="status" hidden></div>
    <div id="filters" role="group" aria-label="Kategori"></div>
    <div id="list"></div>
  </main>
</div>

const KEY = "gundem-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const store = {
  get() { try { return localStorage.getItem(KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch {} },
  del() { try { localStorage.removeItem(KEY); } catch {} }
};
async function derive(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function open(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const tz = { timeZone: "Europe/Istanbul" };
const dayName = d => new Intl.DateTimeFormat("tr-TR", { ...tz, weekday: "long", day: "numeric", month: "long" }).format(d);
const clock = d => new Intl.DateTimeFormat("tr-TR", { ...tz, hour: "2-digit", minute: "2-digit" }).format(d);
const safeUrl = u => { try { const x = new URL(u); return x.protocol === "https:" ? x.href : "#"; } catch { return "#"; } };
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function render(data) {
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("updated").textContent = "Güncellendi: " + dayName(new Date(data.updated)).split(" ").slice(0, 2).join(" ") + " " + clock(new Date(data.updated));
  if (data.status) { const s = document.getElementById("status"); s.textContent = data.status; s.hidden = false; }
  const cats = ["Tümü", "Polemik", "Açıklama", "Kulis", "Haber"];
  const box = document.getElementById("filters"), list = document.getElementById("list");
  let current = "Tümü";
  function draw() {
    list.textContent = "";
    let day = null, ul = null;
    const items = data.items.filter(i => current === "Tümü" || i.cat === current).sort((a, b) => new Date(b.t) - new Date(a.t));
    if (!items.length) list.append(el("h2", "", "Bu kategoride başlık yok"));
    for (const i of items) {
      const d = new Date(i.t), name = dayName(d);
      if (name !== day) { day = name; list.append(el("h2", "", name)); ul = el("ul"); list.append(ul); }
      const li = el("li"), a = el("a");
      a.href = safeUrl(i.url); a.target = "_blank"; a.rel = "noopener noreferrer";
      const body = el("div"), meta = el("div", "meta");
      body.append(el("span", "title", i.title));
      meta.append(el("span", "cat c-" + i.cat, i.cat));
      if (i.src) meta.append(el("span", "", i.src));
      if (i.unverified) meta.append(el("span", "flag", "Doğrulanmadı"));
      body.append(meta);
      a.append(el("time", "", clock(d)), body);
      li.append(a); ul.append(li);
    }
  }
  for (const c of cats) {
    const b = el("button", "", c); b.type = "button"; b.setAttribute("aria-pressed", c === current);
    b.onclick = () => { current = c; box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); };
    box.append(b);
  }
  draw();
}
(async () => {
  const saved = store.get();
  if (saved) {
    try {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
      return render(await open(key));
    } catch { store.del(); }
  }
  const gate = document.getElementById("gate"), err = document.getElementById("err");
  gate.hidden = false;
  gate.addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = "Açılıyor...";
    try {
      const key = await derive(document.getElementById("pass").value);
      const data = await open(key);
      store.set(toB64(await crypto.subtle.exportKey("raw", key)));
      render(data);
    } catch { err.textContent = "Parola yanlış."; }
  });
})();
